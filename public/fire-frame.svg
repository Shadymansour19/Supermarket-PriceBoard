<svg xmlns="http://www.w3.org/2000/svg" viewBox="-34 -78 370 288">
  <defs>
    <!-- Single layer now — a second, smaller inset copy used to be
         drawn on top for a "two-tone" glow, but at a visible size it
         just reads as two separate flames (a yellow one in front of a
         red one), not one flame with depth. One shape, one gradient:
         yellow near the base (where it meets the frame) fading to red
         at the tips. userSpaceOnUse (not the default objectBoundingBox)
         anchors color to absolute height in the artwork rather than each
         redraw's own bounding box, so neighboring peaks of very
         different heights still shade continuously into each other. -->
    <linearGradient id="flameOuter" gradientUnits="userSpaceOnUse" x1="0" y1="-78" x2="0" y2="210">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="30%" stop-color="#ea580c" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <filter id="flameBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" />
    </filter>
    <style>
      /* Four keyframe shapes, each scaling every peak by a DIFFERENT
         independent factor rather than one uniform grow/shrink — a
         different subset of peaks dominates at each step, which is what
         actually reads as flicker/entropy rather than the whole skyline
         pulsing in place. Uneven keyframe spacing (24/51/78, not
         25/50/75) keeps the timing itself from feeling metronomic. Kept
         brisk (2s) — the fix for "looks robotic" is more variety per
         cycle, not a slower cycle. */
