<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 460" preserveAspectRatio="none">
  <defs>
    <linearGradient id="flameOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="35%" stop-color="#ea580c" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="55%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fffbeb" />
    </linearGradient>
    <symbol id="f" viewBox="0 0 64 88">
      <path d="M32 2 C26 10 30 18 24 24 C14 30 6 40 8 54 C10 70 20 82 32 86 C44 82 54 70 56 54 C58 40 50 30 40 24 C34 18 38 10 32 2 Z" fill="url(#flameOuter)" />
      <path d="M32 40 C26 48 22 56 23 66 C24 76 28 82 32 84 C36 82 40 76 41 66 C42 56 38 48 32 40 Z" fill="url(#flameInner)" />
    </symbol>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes flk {
        0%, 100% { transform: scale(1) rotate(-3deg); opacity: 0.85; }
        25% { transform: scale(1.15) rotate(3deg); opacity: 1; }
        50% { transform: scale(0.92) rotate(-3deg); opacity: 0.8; }
        75% { transform: scale(1.1) rotate(3deg); opacity: 1; }
      }
      .flk {
        animation: flk 1.1s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @media (prefers-reduced-motion: reduce) {
        .flk { animation: none; }
      }
    </style>
  </defs>

  <!-- The glowing rounded-rect frame outline — a card's own border sits
       right behind this in the app, so this line is drawn a hair outside
       it purely for the ambient bloom, not to replace the card's border. -->
  <rect
    x="20"
    y="90"
    width="300"
    height="350"
    rx="18"
    ry="18"
    fill="none"
    stroke="#fbbf24"
    stroke-width="5"
    filter="url(#glow)"
  />

  <g transform="translate(26 72) rotate(-18 0 17.9)">
