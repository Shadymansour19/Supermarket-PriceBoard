<svg xmlns="http://www.w3.org/2000/svg" viewBox="-34 -62 370 272">
  <defs>
    <!-- userSpaceOnUse (not the default objectBoundingBox) — color now
         depends on absolute height in the artwork, not each path's own
         bounding box. With very uneven peaks, objectBoundingBox stretched
         the same 0-100% gradient across whatever the tallest peak's own
         box was, so a short peak right next to a tall one landed on a
         completely different point of the ramp than its neighbor and the
         color visibly jumped at the valley between them. Anchored to
         absolute coordinates, a given height is always the same color
         everywhere, so neighboring peaks of different heights shade
         continuously into each other instead of stepping. -->
    <linearGradient id="flameOuter" gradientUnits="userSpaceOnUse" x1="0" y1="-62" x2="0" y2="210">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="30%" stop-color="#ea580c" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="flameInner" gradientUnits="userSpaceOnUse" x1="0" y1="-62" x2="0" y2="210">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fffbeb" />
    </linearGradient>
    <filter id="flameBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" />
    </filter>
    <style>
      /* Outer and inner run on deliberately mismatched periods (3.8s vs
         4.6s) with uneven keyframe timing and a negative delay (starts
         mid-cycle rather than both together at 0%) — a shared/synced
         period reads as an obvious metronome after a couple of loops,
         while two periods whose ratio isn't a simple fraction only
         realign every ~87s (their LCM), long past where a viewer is
         watching closely enough to notice it repeats at all. */
