      }
      .flk-outer { animation: flkOuter 3.8s ease-in-out infinite; }
      .flk-inner { animation: flkInner 4.6s ease-in-out infinite -1.3s; }
      @media (prefers-reduced-motion: reduce) {
        .flk-outer, .flk-inner { animation: none; }
      }
    </style>
  </defs>

