<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 -48 344 258">
  <defs>
    <linearGradient id="flameOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="30%" stop-color="#ea580c" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fffbeb" />
    </linearGradient>
    <filter id="flameBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" />
    </filter>
    <style>
      @keyframes flk {
        0%, 100% { transform: scaleY(1) translateY(0); opacity: 0.92; }
        25% { transform: scaleY(1.035) translateY(-3px); opacity: 1; }
        50% { transform: scaleY(0.975) translateY(1px); opacity: 0.88; }
        75% { transform: scaleY(1.02) translateY(-2px); opacity: 1; }
      }
      .flk {
        animation: flk 1.6s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 50% 100%;
      }
      @media (prefers-reduced-motion: reduce) {
        .flk { animation: none; }
      }
    </style>
  </defs>

