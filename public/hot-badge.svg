<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 62">
  <defs>
    <radialGradient id="ball" cx="35%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="45%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </radialGradient>
    <linearGradient id="flameOuter" x1="0.3" y1="1" x2="0.75" y2="0">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="flameInner" x1="0.3" y1="1" x2="0.75" y2="0">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="45%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <style>
      @keyframes flk {
        0%, 100% { transform: scale(1) rotate(-2deg); opacity: 0.92; }
        30% { transform: scale(1.06) rotate(2deg); opacity: 1; }
        60% { transform: scale(0.96) rotate(-2deg); opacity: 0.88; }
      }
      .flk {
        animation: flk 1.3s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 0% 100%;
      }
      @media (prefers-reduced-motion: reduce) {
        .flk { animation: none; }
      }
    </style>
