<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f3d2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hamada" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600&family=Cairo:wght@600;700;800;900&family=Lalezar&family=Rakkas&family=Lemonada:wght@700&family=Playpen+Sans+Arabic:wght@800&family=Tajawal:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Super Market Hamada</title>
    <!-- Default/fallback preview for sharing the site itself (home, cart, etc).
         A specific product page overrides these via the bot-only rewrite in
         vercel.json + api/product-meta.ts — see that file for why: this is a
         client-rendered SPA, so a crawler hitting /product/:id directly would
         otherwise only ever see this generic card, never that product's own
         name/photo. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Super Market Hamada" />
    <meta property="og:title" content="Super Market Hamada" />
    <meta property="og:description" content="Groceries from Super Market Hamada — browse the catalog and order on WhatsApp." />
    <meta property="og:image" content="https://super-market-hamada.vercel.app/logo.jpg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Super Market Hamada" />
    <meta name="twitter:description" content="Groceries from Super Market Hamada — browse the catalog and order on WhatsApp." />
    <meta name="twitter:image" content="https://super-market-hamada.vercel.app/logo.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
